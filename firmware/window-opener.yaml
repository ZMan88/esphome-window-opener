# Window Opener — entry-point ESPHome config.
#
# Selects the actuator variant via `packages:` below. Swap the `variant:` line
# between `variants/linear-actuator.yaml` and `variants/stepper.yaml` to switch
# hardware paths. All shared Wi-Fi / API / OTA lives in common/base.yaml.
#
# See CLAUDE.md for the architecture overview and PLAN.md for the roadmap.

substitutions:
  device_name: window-opener
  device_friendly: "Window Opener"

  # The window's existing "is it closed?" contact sensor, ALREADY in Home
  # Assistant (a reed/contact sensor, Zigbee/Z-Wave door sensor, etc.). This is
  # NOT an external_component — it's an HA entity pulled back over the API.
  # Put the real entity id here. Convention assumed: state "on" = OPEN,
  # "off" = CLOSED (flip the lambda in stepper-uart.yaml if yours is reversed).
  # This overrides the default in the active variant file.
  closed_sensor_entity: "binary_sensor.0x00158d000a9873f3_contact"

  # ── Tuning knobs (stepper-uart variant) ──────────────────────────────────
  # These override the defaults in variants/stepper-uart.yaml — edit here.
  #
  # Speed: mm/s = max_speed ÷ (50 × microsteps). At microsteps 16,
  #   6000 steps/s = 7.5 mm/s. If the motor crawls/skips when you raise this,
  #   the C6 can't pulse fast enough — drop microsteps to 8 AND set
  #   steps_full_stroke to 72000 (see the variant's notes) rather than lowering.
  max_speed: "6000"            # steps/s
  accel: "3000"                # steps/s^2 (ramp; raise so short tilt moves cruise)
  #
  # Currents (TMC2209, software-set, Vref pot ignored). run_current is the MAX
  # motion current — motor (LDO 42STH48-1684MAC) is rated 1.68 A RMS, so keep
  # ≤ ~1500mA and watch the driver temperature-band sensor.
  run_current: "1100mA"        # MAX motion current
  hold_current: "500mA"        # standstill, unlocked
  lock_hold_current: "900mA"   # standstill while locked
  # ─────────────────────────────────────────────────────────────────────────

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
  # If your ESPHome version does not yet recognise the XIAO board name,
  # fall back to:
  #   board: esp32-c6-devkitc-1
  # The GPIO numbers below match the XIAO breakout — they're correct on
  # any ESP32-C6 board, only the silkscreen labels (D1/D2/D3/D8) differ.

packages:
  base: !include common/base.yaml

  # Active variant — keep exactly one of these uncommented.
  # variant: !include variants/linear-actuator.yaml
  # variant: !include variants/stepper.yaml         # basic STEP/DIR (no UART, Vref pot sets current)
  variant: !include variants/stepper-uart.yaml      # UART-driven: current/load/temp, lock, free-wheel, HA closed-sensor homing
