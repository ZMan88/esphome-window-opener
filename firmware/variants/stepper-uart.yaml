# Variant: NEMA17 stepper driven by a TMC2209 in UART mode.
#
# Closely follows the slimcdk component author's reference config:
# https://github.com/slimcdk/esphome-custom-components/blob/master/esphome/components/tmc2209/README.md#example-config
#
# Wiring (XIAO ESP32-C6 → BTT TMC2209 V1.3 pads):
#   3V3                       → VIO
#   GND                       → GND (logic + motor power common)
#   D1  (GPIO1)               → DIR
#   D2  (GPIO2)               → STEP
#   D3  (GPIO21)              → EN
#   D6  (GPIO16) + 1 kΩ       → driver TX  (UART, see note below)
#   D7  (GPIO17)              → driver RX  (UART, no resistor)
#   D8  (GPIO19)              → endstop switch COM
#   D9  (GPIO20)              → driver DIAG  (optional but strongly recommended
#                                             for working stall detection — see
#                                             diag_pin: line below)
#
# BTT V1.3 R10 must be bridged (factory NC) before TX pad is electrically live.
# See hardware/wiring/stepper.md for the R10 detail and the 1 kΩ rationale.
#
# Pin map: hardware/wiring/stepper.md
#
# ─────────────────────────────────────────────────────────────────────────
# FEATURE SET (TMC2209/UART-specific — not portable to the linear-actuator
# variant, which has no current control or freewheel concept):
#
#   • Homing            — drives toward the closed end until the closed signal
#                         trips, then zeroes. Boot is PASSIVE: no auto-motion
#                         (a power blip won't slam an open window shut). On boot
#                         position is `unknown` and is recovered for free the
#                         moment the closed contact reports shut (zeroes in
#                         place), or by a homing sweep before the first move if
#                         still unknown. Locked state is the one exception — it
#                         actively drives closed on boot to re-clamp. Position
#                         reads `unknown` in HA until homed (CLAUDE.md invariant).
#   • End detection     — selected by the `homing_mode` substitution:
#                           contact    (default): home CLOSED from the window's
#                             OWN HA contact sensor (${closed_sensor_entity});
#                             OPEN is the calibrated step count (g_full_stroke),
#                             with StallGuard only an obstruction backstop.
#                           sensorless: no contact. Home CLOSED by ramming the
#                             stop at a gentle current until StallGuard trips,
#                             and LEARN the OPEN end from the opening-direction
#                             stall. REQUIRES a tuned stall_threshold (> 0).
#                         (Printed D8 endstop is left commented for when added;
#                         in contact mode, homing depends on the HA connection.)
#   • Lock              — `lock.window_lock`. Drives fully closed, then holds
#                         energized at ${lock_hold_current} so the screw
#                         resists back-driving. Open/position commands are
#                         refused while locked (closing is still allowed).
#                         The manual handle remains the real mechanical lock.
#   • Free-wheel        — `switch.window_freewheel`. Releases the coils
#                         (standstill_mode: freewheeling, 0 mA hold) so the
#                         window can be moved by hand. While free-wheeling,
#                         a transition of the closed signal means the sash was
#                         physically moved → position is marked unknown and the
#                         next command re-homes first. NOTE: a bare TMC2209 has
#                         no rotor feedback, so hand-movement that never crosses
#                         the closed sensor cannot be detected — re-engaging
#                         then keeps the last position. Add an encoder if that
#                         matters. Cannot be enabled while locked.
#   • Home now          — `button` "Home now (drive to closed)" runs the homing
#                         sweep on demand (move_to only auto-homes when position
#                         is unknown). Drives the motor.
#   • Manual calibration— two `button` entities: "Set CLOSED home (0%) here" and
#                         "Set OPEN limit (100%) here". Capture the current motor
#                         step count as the closed (0) / open (full-stroke)
#                         reference, so you can teach both ends by jogging to
#                         them — no contact sensor or StallGuard needed. The
#                         open scale is live-only (resets to steps_full_stroke on
#                         reboot). Captures motor-driven position only, not hand
#                         movement in free-wheel.
# ─────────────────────────────────────────────────────────────────────────

substitutions:
  # Geometry → step scale. These two MUST stay consistent:
  #   µsteps/mm = (360/0.9) × microsteps / 8 mm-per-rev = 50 × microsteps
  #   steps_full_stroke = µsteps/mm × 180 mm stroke
  # At microsteps 16 → 800 µsteps/mm → 144000.  At 8 → 400 → 72000.
  microsteps: "16"
  steps_full_stroke: "144000"

  # Speed. max_speed is the top cruise rate in steps/s; mm/s = max_speed ÷
  # (50 × microsteps). At microsteps 16: 6000 steps/s = 7.5 mm/s → ~24 s for
  # the full 180 mm stroke, ~7 s for a full tilt (~26% of stroke).
  # acceleration/deceleration is the ramp; raise it too or short tilt moves
  # never reach cruise.
  #
  # If the motor CRAWLS or SKIPS at higher max_speed, the C6 can't generate
  # STEP pulses fast enough (single-thread limit) — DON'T just lower max_speed,
  # instead drop microsteps to 8 (and steps_full_stroke to 72000): same mm/s at
  # half the pulse rate, and `interpolation: true` keeps the motor smooth.
  max_speed: "6000"      # steps/s   (was 2000 = 2.5 mm/s)
  accel: "3000"          # steps/s^2 (was 1000)

  # TMC2209 currents — set in software over UART, the Vref pot is IGNORED.
  # run_current is the MAX current (TMC2209 IRUN) while the motor is moving;
  # raise it for more torque/speed-under-load, lower it if the driver runs hot.
  # Ceiling: the LDO 42STH48-1684MAC is rated 1.68 A RMS — stay at/below ~1500mA
  # and watch the "driver temperature band" sensor. hold_current is the
  # standstill clamp; lock_hold_current is the firmer clamp while locked.
  run_current: "1100mA"        # MAX motion current  (motor rated 1.68 A)
  hold_current: "500mA"        # standstill, unlocked
  lock_hold_current: "900mA"   # standstill while locked (firmer anti-backdrive)

  # End detection mode:
  #   contact    — home CLOSED from the HA contact sensor; OPEN by step count
  #                (stall is only a safety backstop / obstruction stop).
  #   sensorless — no contact: home CLOSED by ramming the stop until StallGuard
  #                trips, and LEARN the OPEN end from the opening-direction stall.
  # Sensorless REQUIRES a tuned stall_threshold (> 0) — see docs/build-log.md
  # "Phase 3 — StallGuard tuning". With contact mode keep stall_threshold 0
  # until tuned (it's just an obstruction backstop there).
  homing_mode: "contact"       # contact | sensorless
  stall_threshold: "0"         # SGTHRS (0 = stall detection off). Sensorless needs > 0.
  homing_current: "600mA"      # gentler current while ram-homing (sensorless): softer
                               # impact + earlier, cleaner StallGuard trip at the stop.

  # The window's OWN closed/contact sensor, already present in Home Assistant.
  # SET THE REAL ENTITY ID IN window-opener.yaml (it overrides this default) —
  # this line is just a fallback so the variant validates standalone. Door/window
  # contacts follow the HA convention state "on" = OPEN, "off" = CLOSED, handled
  # in window_closed's lambda below; flip it there if your sensor is reversed.
  closed_sensor_entity: "binary_sensor.window_contact"

external_components:
  # PINNED to a specific commit (was `refresh: 1d` off master) so the driver
  # code is a frozen, reproducible baseline — no silent daily re-pulls while
  # we're chasing a crash. b5f0e44 (2026-03-04) is master HEAD as of pinning
  # and is exactly what the running firmware was built against. NOTE: the
  # earlier compile break (tmc2209.enable/disable) and deprecation warnings came
  # from the ESPHome CORE moving (2026.x), not this component — pinning here
  # does not pin the core. To update deliberately, bump the ref below.
  - source: github://slimcdk/esphome-custom-components@b5f0e44ae8732f68b9bbeaed9e962ca052d04cdb
    components: [tmc2209_hub, tmc2209, stepper]
    refresh: 0s

uart:
  - id: tmc_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 500000

tmc2209_hub:
  - id: window_hub
    uart_id: tmc_uart

stepper:
  - platform: tmc2209
    id: window_stepper
    tmc2209_hub_id: window_hub
    rsense: 110 mOhm
    vsense: False
    step_pin: GPIO2
    dir_pin:  GPIO1
    enn_pin:  GPIO21        # Do NOT set inverted: true — component inverts internally.
    diag_pin: GPIO20       # ← Uncomment ONCE driver DIAG pad is wired to D9.
    #                          With this set, the component uses a hardware
    #                          interrupt for stall detection. Without it, the
    #                          component polls IOIN over UART, which is unreliable
    #                          during motion (main thread busy generating steps).
    max_speed: ${max_speed} steps/s
    acceleration: ${accel} steps/s^2
    deceleration: ${accel} steps/s^2
    on_stall:
      - logger.log:
          level: INFO
          format: "Stall detected — stopping window"
      - stepper.stop: window_stepper
      # Interpret the stall by what we were doing when it fired:
      - if:
          condition:
            lambda: 'return id(g_homing);'
          then:
            # Hit the closed hard stop during a homing sweep → this IS home.
            - stepper.report_position: { id: window_stepper, position: 0 }
            - stepper.set_target: { id: window_stepper, target: 0 }
            - globals.set: { id: g_homed, value: 'true' }
            - globals.set: { id: g_homing, value: 'false' }
            - logger.log: "Homed via stall (closed hard stop)"
          else:
            - if:
                condition:
                  lambda: 'return id(g_move_dir) == 1;'
                then:
                  - if:
                      condition: { lambda: 'return id(g_sensorless);' }
                      then:
                        # Sensorless: the opening stall IS the open end. Learn the
                        # stroke (current pos becomes 100%).
                        - lambda: 'id(g_full_stroke) = id(window_stepper).current_position;'
                        - logger.log:
                            format: "Open end learned via stall at %d µsteps"
                            args: [ 'id(window_stepper).current_position' ]
                      else:
                        # Contact mode: the open count is trusted, so a stall here
                        # is an obstruction (or over-long calibration). Stop + hold,
                        # do NOT learn or auto-retry (CLAUDE.md safety invariant).
                        - logger.log: "Obstruction while opening — stopped and holding"
                # else: stalled while closing/holding → obstruction. Stop and
                # hold, do NOT auto-retry.
      - globals.set: { id: g_move_dir, value: '0' }
    on_status:
      # Surface the chip's temperature threshold flags as a single sensor that
      # holds the lower bound of the current band: 0 / 120 / 143 / 150 / 157.
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_ABOVE_120C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 120 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_BELOW_120C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 0 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_ABOVE_143C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 143 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_BELOW_143C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 120 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_ABOVE_150C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 150 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_BELOW_150C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 143 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_ABOVE_157C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 157 } }
      - if:
          condition: { lambda: 'return code == tmc2209::TEMPERATURE_BELOW_157C;' }
          then: { sensor.template.publish: { id: driver_temp_band, state: 150 } }

# ---- runtime state ----
globals:
  - id: g_homed          # position is known (a successful home has happened)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_homing         # a homing sweep is in progress (used by on_stall)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_locked         # lock engaged; persists across reboot
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: g_freewheel      # driver disabled, window hand-movable
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_pos_dirty      # closed signal moved while free-wheeling → position suspect
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_move_dir       # last commanded direction: +1 opening, -1 closing, 0 idle
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_sensorless     # true if homing_mode == sensorless (set from substitution)
    type: bool
    restore_value: no
    initial_value: 'std::string("${homing_mode}") == std::string("sensorless")'
  - id: g_full_stroke    # full-open position in µsteps. Fixed in contact mode,
    type: int            # LEARNED from the open-stall in sensorless mode, or set
    #                      live by the "Set OPEN limit here" button.
    #                      restore_value: no ON PURPOSE — steps_full_stroke (the
    #                      substitution) is the authoritative scale and wins every
    #                      boot. If this persisted, an old saved value would
    #                      override a changed microsteps/steps_full_stroke after a
    #                      flash and the open end would be wrong. The button is for
    #                      live calibration; to persist, write the measured count
    #                      into the steps_full_stroke substitution.
    restore_value: no
    initial_value: '${steps_full_stroke}'

script:
  # Engage / release the motor via standstill current, NOT tmc2209.enable/
  # disable: the slimcdk ActivationAction fails to compile under ESPHome's
  # 2026-04 TemplatableFn change. standstill_mode: freewheeling + 0 mA hold
  # releases the coils at rest (shaft hand-movable) without touching enn.
  # These scripts have no delays, so script.execute runs them synchronously
  # (currents are applied before the caller's next action).
  - id: motor_engage         # normal hold — driver clamps position at standstill
    then:
      - tmc2209.currents:
          id: window_stepper
          standstill_mode: normal
          run_current: ${run_current}
          hold_current: ${hold_current}
  - id: motor_freewheel      # release coils at standstill — window hand-movable
    then:
      - tmc2209.currents:
          id: window_stepper
          standstill_mode: freewheeling
          run_current: ${run_current}
          hold_current: 0mA

  # Drive toward the closed end and zero there. Contact mode: stop when the HA
  # contact reports shut. Sensorless mode: ram the stop at a gentle current until
  # StallGuard trips (on_stall's g_homing branch zeroes). Either way wait_until
  # accepts both signals, so the same script covers both modes.
  - id: do_home
    mode: restart
    then:
      - logger.log: "Homing → driving toward closed"
      # Make sure the driver is live (a homing request overrides free-wheel).
      - if:
          condition: { lambda: 'return id(g_freewheel);' }
          then:
            - script.execute: motor_engage
            - globals.set: { id: g_freewheel, value: 'false' }
      # Sensorless: drop to the gentle homing current so the ram is soft and the
      # stall trips cleanly at the stop. (No effect in contact mode.)
      - if:
          condition: { lambda: 'return id(g_sensorless);' }
          then:
            - tmc2209.currents:
                id: window_stepper
                standstill_mode: normal
                run_current: ${homing_current}
                hold_current: ${hold_current}
      - globals.set: { id: g_homing, value: 'true' }
      - globals.set: { id: g_move_dir, value: '-1' }
      - stepper.set_target:
          id: window_stepper
          target: !lambda 'return id(window_stepper).current_position - (long)(id(g_full_stroke) * 1.2);'
      - wait_until:
          condition:
            or:
              - binary_sensor.is_on: window_closed     # contact mode
              - lambda: 'return id(g_homed);'          # sensorless: set by on_stall
          timeout: 120s
      - stepper.stop: window_stepper
      - if:
          condition:
            binary_sensor.is_on: window_closed
          then:
            - stepper.report_position: { id: window_stepper, position: 0 }
            - stepper.set_target: { id: window_stepper, target: 0 }
            - globals.set: { id: g_homed, value: 'true' }
            - globals.set: { id: g_pos_dirty, value: 'false' }
            - logger.log: "Homed (closed contact)"
          else:
            - if:
                condition: { lambda: 'return id(g_homed);' }
                then:
                  - logger.log: "Homed (closed hard stop via stall)"
                else:
                  - logger.log:
                      level: WARN
                      format: "Homing failed within 120 s (no contact / no stall) — position stays unknown"
      # Restore the normal running current after a sensorless ram.
      - if:
          condition: { lambda: 'return id(g_sensorless);' }
          then:
            - script.execute: motor_engage
      - globals.set: { id: g_homing, value: 'false' }
      - globals.set: { id: g_move_dir, value: '0' }

  # Single entry point for all motion. Enforces lock + homing, then targets pos.
  - id: move_to
    mode: restart
    parameters:
      pos: float
    then:
      - if:
          condition:
            lambda: 'return id(g_locked) && pos > 0.001f;'
          then:
            - logger.log: "Locked — open/position command ignored (unlock first)"
          else:
            # ALWAYS (re)apply running currents over UART before driving, so the
            # driver can never sit in a released / 0-current standstill while we
            # think it's engaged. This is the fix for "command accepted but motor
            # silent": at boot (or after a UART hiccup) the chip can be in a
            # de-energised state with g_freewheel == false; the old code only
            # re-engaged when g_freewheel was true, so the move set a target with
            # no torque. Skipped only while locked (the lock clamp owns currents,
            # and a close-while-locked is already engaged).
            - if:
                condition: { lambda: 'return !id(g_locked);' }
                then:
                  - script.execute: motor_engage
            # Leaving free-wheel: clear the flag. If the sash was moved across the
            # closed sensor while free, position is now unknown → force re-home.
            - if:
                condition: { lambda: 'return id(g_freewheel);' }
                then:
                  - globals.set: { id: g_freewheel, value: 'false' }
                  - if:
                      condition: { lambda: 'return id(g_pos_dirty);' }
                      then:
                        - globals.set: { id: g_homed, value: 'false' }
            # Re-home first if position is unknown.
            - if:
                condition: { lambda: 'return !id(g_homed);' }
                then:
                  - script.execute: do_home
                  - script.wait: do_home
            # Only move if homing succeeded.
            - if:
                condition: { lambda: 'return id(g_homed);' }
                then:
                  - globals.set:
                      id: g_move_dir
                      value: !lambda 'return ((long)(pos * id(g_full_stroke)) >= id(window_stepper).current_position) ? 1 : -1;'
                  - stepper.set_target:
                      id: window_stepper
                      target: !lambda 'return (long)(pos * id(g_full_stroke));'

esphome:
  on_boot:
    - tmc2209.configure:
        id: window_stepper
        microsteps: ${microsteps}
        interpolation: true
        # TCOOLTHRS gates the chip's DIAG-for-stall output. The TMC2209
        # datasheet requires it > 0 for StallGuard to drive DIAG (with
        # TCOOLTHRS = 0, DIAG only signals driver errors). Setting it
        # high (close to max 20-bit) means StallGuard is active across
        # the entire useful motion velocity range. Without this, on_stall
        # never fires no matter how hard you hold the shaft.
        tcool_threshold: 400000
    - tmc2209.stallguard:
        id: window_stepper
        # SGTHRS = 0 disables stall detection via the DIAG output (the chip
        # only fires DIAG for driver errors, not for SG_RESULT < SGTHRS*2).
        # Why: at the bench with no mechanical load, SG_RESULT sits in 0-16
        # even during normal motion, so any non-zero threshold trips on every
        # move. RE-TUNE after Phase 2 mounting: with the lead-screw + sash
        # load, watch the actual_current / motor_load sensors during a full
        # open/close, note the SG_RESULT floor under normal load, then set
        # SGTHRS to ~half of that floor. SENSORLESS homing_mode REQUIRES this
        # > 0 (it's how both ends are found); contact mode can leave it 0.
        threshold: ${stall_threshold}
    - tmc2209.currents:
        id: window_stepper
        standstill_mode: normal
        run_current: ${run_current}
        hold_current: ${hold_current}
    # Homing on boot is deliberately PASSIVE for the unlocked case: we never
    # auto-drive the motor on boot, so a power blip can't slam an open window
    # shut. Position stays `unknown` until recovered:
    #   contact mode    — for free when the contact reports shut (window_closed's
    #                     on_press homes in place, no motion), else on first cmd.
    #   sensorless mode — on the first user command (which ram-homes closed).
    # The ONLY exception is restoring a lock, where we actively drive closed and
    # re-clamp.
    - delay: 3s
    - if:
        condition: { lambda: 'return id(g_locked);' }
        then:
          - logger.log: "Restoring lock — driving closed and clamping"
          - script.execute: do_home
          - script.wait: do_home
          - tmc2209.currents:
              id: window_stepper
              standstill_mode: normal
              run_current: ${run_current}
              hold_current: ${lock_hold_current}
          # window_lock's lambda already reports LOCKED from the restored g_locked.

sensor:
  - platform: tmc2209
    tmc2209_id: window_stepper
    type: actual_current
    name: "Window opener — actual current"
    update_interval: 5s

  - platform: tmc2209
    tmc2209_id: window_stepper
    type: motor_load
    name: "Window opener — motor load"
    update_interval: 1s    # Bump to 250ms during Phase 3 stall tuning.

  # --- Diagnostic sensors (disabled) ---
  # These poll TMC2209 registers over UART. The slimcdk stepper generates
  # STEP pulses on the same main thread, so even at slow update intervals
  # (1s) these were starving the pulse generator and the motor crawled.
  # Re-enable a subset during Phase 3 StallGuard tuning, then disable again.
  # See `docs/build-log.md` "Phase 3 — StallGuard tuning procedure".
  #
  # - platform: tmc2209
  #   tmc2209_id: window_stepper
  #   type: stallguard_result
  #   name: Driver stallguard
  #   update_interval: 250ms
  #
  # - platform: tmc2209
  #   tmc2209_id: window_stepper
  #   type: pwm_scale_sum
  #   name: PWM Scale Sum
  #   update_interval: 1s
  #
  # - platform: tmc2209
  #   tmc2209_id: window_stepper
  #   type: pwm_scale_auto
  #   name: PWM Scale Auto
  #   update_interval: 1s
  #
  # - platform: tmc2209
  #   tmc2209_id: window_stepper
  #   type: pwm_ofs_auto
  #   name: PWM OFS Auto
  #   update_interval: 30s
  #
  # - platform: tmc2209
  #   tmc2209_id: window_stepper
  #   type: pwm_grad_auto
  #   name: PWM Grad Auto
  #   update_interval: 30s

  - platform: template
    id: driver_temp_band
    name: "Window opener — driver temperature band"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    icon: mdi:thermometer
    entity_category: diagnostic

binary_sensor:
  # Printed closed-end microswitch on D8. NOT INSTALLED at the moment — closed
  # detection currently runs off the HA contact sensor alone. To add the
  # physical endstop later: uncomment this block AND the endstop_closed term in
  # window_closed's lambda below.
  # - platform: gpio
  #   id: endstop_closed
  #   pin:
  #     number: GPIO19          # XIAO D8
  #     mode: INPUT_PULLUP
  #     inverted: true

  # The window's OWN contact sensor, imported from Home Assistant. Requires the
  # API connection (common/base.yaml). Convention: state "on" = OPEN.
  - platform: homeassistant
    id: ha_window_contact
    entity_id: ${closed_sensor_entity}
    internal: true

  # "Sash is shut" signal. Currently the HA contact alone; OR in the printed
  # endstop once it's installed. This is the homing reference and the
  # free-wheel move-detector.
  - platform: template
    id: window_closed
    name: "Window at closed position"
    icon: mdi:window-closed-variant
    lambda: |-
      // HA window/door contact: has_state() guards against "unavailable"
      // (defaults to false, which would otherwise read as CLOSED). Flip the
      // "!...state" if your sensor reports on == closed.
      bool ha_closed = id(ha_window_contact).has_state() && !id(ha_window_contact).state;
      return ha_closed;   // || id(endstop_closed).state;  ← add when D8 is wired
    on_press:
      # Became closed → snap the home reference to 0 (corrects any drift).
      - stepper.report_position: { id: window_stepper, position: 0 }
      - stepper.set_target: { id: window_stepper, target: 0 }
      - globals.set: { id: g_homed, value: 'true' }
      - globals.set: { id: g_pos_dirty, value: 'false' }
    on_release:
      # Left closed while free-wheeling → the sash was moved by hand.
      - if:
          condition: { lambda: 'return id(g_freewheel);' }
          then:
            - globals.set: { id: g_pos_dirty, value: 'true' }
            - globals.set: { id: g_homed, value: 'false' }
            - logger.log: "Window moved by hand while free-wheeling — position unknown"

cover:
  - platform: template
    name: "Window"
    id: window_cover
    device_class: window
    has_position: true
    lambda: |-
      if (!id(g_homed)) return NAN;   // unknown until first home
      float fs = id(g_full_stroke);   // fixed (contact) or learned (sensorless)
      if (fs < 1) fs = 1;
      return id(window_stepper).current_position / fs;
    open_action:
      - script.execute: { id: move_to, pos: 1.0 }
    close_action:
      - script.execute: { id: move_to, pos: 0.0 }
    position_action:
      - script.execute: { id: move_to, pos: !lambda 'return pos;' }
    stop_action:
      - script.stop: move_to
      - script.stop: do_home
      - stepper.stop: window_stepper
      - globals.set: { id: g_homing, value: 'false' }
      - globals.set: { id: g_move_dir, value: '0' }

# Motor-driven "hold it shut" lock. Not the mechanical handle lock — this keeps
# the actuator clamped closed and refuses to open until unlocked.
lock:
  - platform: template
    name: "Window lock"
    id: window_lock
    icon: mdi:lock
    # State is derived from g_locked; the lambda auto-reports it (no manual publish).
    lambda: |-
      return id(g_locked) ? lock::LOCK_STATE_LOCKED : lock::LOCK_STATE_UNLOCKED;
    lock_action:
      - logger.log: "Locking — closing fully and clamping"
      - script.execute: { id: move_to, pos: 0.0 }
      - script.wait: move_to
      - globals.set: { id: g_locked, value: 'true' }
      - tmc2209.currents:
          id: window_stepper
          standstill_mode: normal
          run_current: ${run_current}
          hold_current: ${lock_hold_current}
    unlock_action:
      - globals.set: { id: g_locked, value: 'false' }
      - tmc2209.currents:
          id: window_stepper
          standstill_mode: normal
          run_current: ${run_current}
          hold_current: ${hold_current}
      - logger.log: "Unlocked"

# Free-wheel: disable the driver so the window can be moved by hand.
switch:
  - platform: template
    name: "Window free-wheel"
    id: window_freewheel
    icon: mdi:hand-back-right
    # State is derived from g_freewheel; the lambda auto-reports it. A rejected
    # turn-on simply leaves g_freewheel false, so the toggle reverts on its own.
    lambda: 'return id(g_freewheel);'
    turn_on_action:
      - if:
          condition: { lambda: 'return id(g_locked);' }
          then:
            - logger.log: "Cannot free-wheel while locked — unlock first"
          else:
            - logger.log: "Free-wheel ON — coils released; window is hand-movable"
            - script.stop: move_to
            - script.stop: do_home
            - stepper.stop: window_stepper
            - script.execute: motor_freewheel
            - globals.set: { id: g_freewheel, value: 'true' }
            - globals.set: { id: g_pos_dirty, value: 'false' }
    turn_off_action:
      - logger.log: "Free-wheel OFF — re-engaging motor"
      - script.execute: motor_engage
      - globals.set: { id: g_freewheel, value: 'false' }
      - if:
          condition: { lambda: 'return id(g_pos_dirty);' }
          then:
            - logger.log: "Sash was moved by hand — position unknown, will re-home on next command"
            - globals.set: { id: g_homed, value: 'false' }

# Manual calibration buttons. Teach the firmware where closed (0%) and fully
# open (100%) are, from wherever the actuator currently sits — no contact sensor
# or StallGuard needed. Typical flow on the mounted window:
#   1. Jog the window (cover slider, small steps) until it's PHYSICALLY closed.
#   2. Press "Set CLOSED home (0%)".
#   3. Jog until PHYSICALLY fully open (go gently — StallGuard is off, so there's
#      no obstruction/over-travel protection).
#   4. Press "Set OPEN limit (100%)".
# IMPORTANT: these capture the motor's STEP COUNT, which only tracks
# motor-driven motion. Moving the sash BY HAND in free-wheel does NOT update it,
# so press these only after positioning via the motor (or right after the sash
# crosses the closed contact). The captured open scale is LIVE only — it resets
# to the steps_full_stroke substitution on reboot; bake the measured count into
# that substitution to make it permanent.
button:
  # Trigger a homing sweep on demand: drive toward closed until the contact
  # trips (contact mode) or StallGuard hits the closed stop (sensorless), then
  # zero. Useful any time position drifts or you just want to re-reference,
  # since move_to only auto-homes when position is UNKNOWN. This MOVES the motor.
  - platform: template
    name: "Home now (drive to closed)"
    id: home_now
    icon: mdi:home-import-outline
    on_press:
      - logger.log: "Manual home requested"
      - script.execute: do_home

  - platform: template
    name: "Set CLOSED home (0%) here"
    id: set_closed_here
    icon: mdi:arrow-collapse-left
    entity_category: config
    on_press:
      # Stop any motion so the captured position is stable.
      - script.stop: move_to
      - script.stop: do_home
      - stepper.stop: window_stepper
      - globals.set: { id: g_homing, value: 'false' }
      - globals.set: { id: g_move_dir, value: '0' }
      # Declare here = closed = 0, and mark position known.
      - stepper.report_position: { id: window_stepper, position: 0 }
      - stepper.set_target: { id: window_stepper, target: 0 }
      - globals.set: { id: g_homed, value: 'true' }
      - globals.set: { id: g_pos_dirty, value: 'false' }
      - logger.log: "Manual calibration: current position set as CLOSED (0)"

  - platform: template
    name: "Set OPEN limit (100%) here"
    id: set_open_here
    icon: mdi:arrow-expand-right
    entity_category: config
    on_press:
      - script.stop: move_to
      - script.stop: do_home
      - stepper.stop: window_stepper
      - globals.set: { id: g_homing, value: 'false' }
      - globals.set: { id: g_move_dir, value: '0' }
      # Open must be on the positive side of closed (0). Capture the count as the
      # full stroke; the cover then reads 100% here.
      - if:
          condition:
            lambda: 'return id(window_stepper).current_position > 0;'
          then:
            - lambda: 'id(g_full_stroke) = id(window_stepper).current_position;'
            - stepper.set_target:
                id: window_stepper
                target: !lambda 'return id(window_stepper).current_position;'
            - globals.set: { id: g_homed, value: 'true' }
            - logger.log:
                format: "Manual calibration: OPEN limit set at %d µsteps"
                args: [ 'id(window_stepper).current_position' ]
          else:
            - logger.log:
                level: WARN
                format: "Set OPEN ignored: position %d is not open of closed — set CLOSED home first, then jog open"
                args: [ 'id(window_stepper).current_position' ]
